# 构建并发布应用镜像；只有主干发布成功后才调用既有 Dokploy 入口。
name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pcrdb-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # GHCR 新包可能继承公开仓库可见性；禁止未核私有就首推。
      - name: Require pre-existing private GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! visibility=$(gh api users/lumokato/packages/container/pcrdb --jq .visibility 2>/dev/null); then
            echo '::error::GHCR package missing or unreadable; establish private package through approved setup before publishing.'
            exit 1
          fi
          if [ "$visibility" != private ]; then
            echo '::error::GHCR package is not private; publishing stopped. Do not change visibility to public.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/lumokato/pcrdb
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pcrdb-arm64
          cache-to: type=gha,mode=max,scope=pcrdb-arm64
      - name: Verify published ARM64 image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          image="ghcr.io/lumokato/pcrdb@$DIGEST"
          docker buildx imagetools inspect "$image"
          docker pull --platform linux/arm64 "$image"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = arm64
          docker run --rm --network none --entrypoint python "$image" -m compileall -q /app/src
          printf 'Published `%s` (linux/arm64)\n' "$image" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger existing Dokploy deployment
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_PCRDB_DEPLOY_URL }}
        shell: bash
        run: |
          if [ -z "$DOKPLOY_DEPLOY_URL" ]; then
            echo '::error::Missing repository secret DOKPLOY_PCRDB_DEPLOY_URL; image published, deployment NOT triggered.'
            exit 1
          fi
          payload=$(jq -n --arg sha "$GITHUB_SHA" '{ref:"refs/heads/main",after:$sha,head_commit:{id:$sha,message:"GHCR image published"},commits:[{id:$sha,modified:["docker-compose.yml"]}]}')
          # 不输出 webhook、响应正文或详细 curl 错误（URL 内可能带秘密）。
          if ! curl --silent --fail --connect-timeout 10 --max-time 60 \
            --output /dev/null --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' --data "$payload" "$DOKPLOY_DEPLOY_URL" 2>/dev/null; then
            echo '::error::Dokploy webhook failed; inspect control-plane deployment history before retrying.'
            exit 1
          fi
